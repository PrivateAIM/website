<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta -->
    <title>PrivateAIM — Privacy-Preserving Analytics in Medicine</title>
    <meta name="description" content="PrivateAIM develops FLAME, a federated learning and analysis platform for medical data. Patient data stays at each site and only aggregated results are returned.">
    <meta name="author" content="PrivateAIM Consortium">
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="https://privateaim.de/">
    <link rel="alternate" hreflang="en" href="https://privateaim.de/">
    <link rel="alternate" hreflang="de" href="https://privateaim.de/de">
    <link rel="alternate" hreflang="x-default" href="https://privateaim.de/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://privateaim.de/">
    <meta property="og:title" content="PrivateAIM — Privacy-Preserving Analytics in Medicine">
    <meta property="og:description" content="PrivateAIM develops FLAME, a federated learning and analysis platform for medical data. Patient data stays at each site and only aggregated results are returned.">
    <meta property="og:image" content="https://privateaim.de/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PrivateAIM logo with the tagline: privacy-preserving analytics in medicine">
    <meta property="og:site_name" content="PrivateAIM">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="de_DE">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PrivateAIM — Privacy-Preserving Analytics in Medicine">
    <meta name="twitter:description" content="Federated learning and analysis platform for medical data. Patient data stays at each site.">
    <meta name="twitter:image" content="https://privateaim.de/images/og-image.png">
    <meta name="twitter:image:alt" content="PrivateAIM logo with the tagline: privacy-preserving analytics in medicine">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/images/logo.webp">

    <!-- Preload critical assets -->
    <link rel="preload" href="/images/home/server-analysis.svg" as="image" fetchpriority="high">
    <link rel="preload" href="/src/assets/fonts/HelveticaNeueRoman.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/images/logo-sm.webp" as="image">

</head>
<body>
<script>
    // Apply the saved theme before the prerendered page paints
    try {
        const theme = localStorage.getItem('theme');
        if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        }
    } catch {
        // Storage unavailable: keep the light theme
    }
</script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
