# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
    push:
        branches: [master]
    # Daily rebuild picks up changed GitHub profile pictures of the team
    schedule:
        -   cron: '17 4 * * *'
    workflow_dispatch:

env:
    NODE_VERSION: 24
    NODE_REGISTRY: 'https://registry.npmjs.org'

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    # Full history for the sitemap lastmod dates
                    fetch-depth: 0

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.NODE_VERSION }}

            # Not the shared build action: its cache is keyed by commit, so the
            # scheduled run would reuse the old avatars
            -   name: Build
                run: npm run build

            -   name: Check build output
                run: npm run check-dist

            -   name: CNAME
                run: |
                    cd ./dist/
                    touch CNAME
                    echo "privateaim.de" > CNAME

            -   name: Deploy
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./dist

            # GitHub Pages publishes asynchronously, so retry for a few minutes
            -   name: Check live site
                run: |
                    for attempt in $(seq 1 10); do
                        failed=0
                        for url in $(grep -o '<loc>[^<]*' dist/sitemap.xml | cut -c6-); do
                            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
                            if [ "$status" != 200 ]; then
                                echo "$url: $status"
                                failed=1
                            fi
                        done
                        if [ "$failed" = 0 ]; then
                            exit 0
                        fi
                        sleep 30
                    done
                    exit 1

            # Tell Bing and other IndexNow engines about the pages; not for the daily rebuilds
            -   name: Notify IndexNow
                if: ${{ github.event_name == 'push' }}
                continue-on-error: true
                run: |
                    urls=$(grep -o '<loc>[^<]*' dist/sitemap.xml | cut -c6- | jq -R . | jq -s -c .)
                    curl -sS -X POST https://api.indexnow.org/indexnow \
                        -H 'Content-Type: application/json; charset=utf-8' \
                        -d "{\"host\":\"privateaim.de\",\"key\":\"c17504153cb57d9db689c4ad26e53916\",\"keyLocation\":\"https://privateaim.de/c17504153cb57d9db689c4ad26e53916.txt\",\"urlList\":$urls}" \
                        -w 'IndexNow: %{http_code}\n'
