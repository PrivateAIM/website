# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
    push:
        branches: [master]
    # Daily rebuild picks up changed GitHub profile pictures of the team
    schedule:
        -   cron: '17 4 * * *'
    workflow_dispatch:

env:
    NODE_VERSION: 22
    NODE_REGISTRY: 'https://registry.npmjs.org'

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    # Full history for the sitemap lastmod dates
                    fetch-depth: 0

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.NODE_VERSION }}

            # Not the shared build action: its cache is keyed by commit, so the
            # scheduled run would reuse the old avatars
            -   name: Build
                run: npm run build

            -   name: Check build output
                run: npm run check-dist

            -   name: CNAME
                run: |
                    cd ./dist/
                    touch CNAME
                    echo "privateaim.de" > CNAME

            -   name: Deploy
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./dist
